<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldView</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="hud hud-left">
        <h1>WORLDVIEW</h1>
        <p class="muted">AERIAL INTEL // LIVEFEED</p>
        <div class="panel">
          <p>TOP SECRET // SI-TK // NOFORN</p>
          <p id="modeLabel">MODE: CRT</p>
          <p id="locationLabel">SECTOR: LONDON</p>
          <p class="small">Google Photorealistic 3D Tiles + Open Feeds</p>
        </div>
        <div class="panel small">
          <p><strong>Setup</strong></p>
          <p>Set <code>window.WORLDVIEW_CONFIG.googleMapsApiKey</code> before load.</p>
        </div>
      </aside>

      <main class="viewport-wrap">
        <div class="viewport-shell">
          <div id="cesiumContainer"></div>
          <div class="scanlines"></div>
          <div class="reticle"></div>
        </div>

        <div class="mode-bar" id="modeBar"></div>
      </main>

      <aside class="hud hud-right">
        <div class="panel">
          <p>REC <span id="clock"></span></p>
          <p>AIR: <span id="airCount">0</span> | SAT: <span id="satCount">0</span></p>
        </div>
        <div class="panel controls">
          <label>Bloom <input id="bloom" type="range" min="0" max="100" value="72" /></label>
          <label>Sharpness <input id="sharpness" type="range" min="0" max="100" value="55" /></label>
          <label>Panoptic <input id="panoptic" type="range" min="0" max="100" value="65" /></label>
        </div>
      </aside>
    </div>

    <script>
      window.WORLDVIEW_CONFIG = window.WORLDVIEW_CONFIG || {
        googleMapsApiKey: "REPLACE_WITH_GOOGLE_MAPS_API_KEY"
      };
    </script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
