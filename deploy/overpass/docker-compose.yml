services:
  overpass-api:
    image: wiktorn/overpass-api:0.7.62
    container_name: vector-overpass-api
    ports:
      - "127.0.0.1:12345:80"
    environment:
      - OVERPASS_META=yes
      - OVERPASS_MODE=init
      - OVERPASS_PLANET_URL=https://download.geofabrik.de/north-america/us/louisiana-latest.osm.bz2
      - OVERPASS_DIFF_URL=https://download.geofabrik.de/north-america/us/louisiana-updates
    volumes:
      - overpass-db:/db
      - overpass-rules:/rules
    restart: unless-stopped

volumes:
  overpass-db:
  overpass-rules:
